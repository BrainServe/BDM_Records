
server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  error:
    include-message: never

spring:
  application:
    name: institution-directory

  # Optional .env support for local development
  config:
    import: "optional:file:./.env[.properties]"

  # PostgreSQL database
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000

  # Hibernate / JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

  # JSON validation
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  # React frontend origin
  frontend-origin: ${FRONTEND_ORIGIN}

  # JWT authentication
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: institution-directory
    access-seconds: ${JWT_ACCESS_SECONDS:900}

  # Refresh token configuration
  refresh:
    days: 7
    cookie-secure: ${COOKIE_SECURE:true}

  # Initial admin setup
  setup:
    key: ${ADMIN_SETUP_KEY:}

  # PDF export font
  pdf:
    font-path: ${PDF_FONT_PATH:}
