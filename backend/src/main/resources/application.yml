server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never

spring:
  application:
    name: institution-directory

  # Optional local .env support when Spring Boot starts from the backend folder.
  # External environment variables can still override these values.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  frontend-origin: ${FRONTEND_ORIGIN}

  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: institution-directory
    access-seconds: ${JWT_ACCESS_SECONDS:900}

  refresh:
    days: 7
    # Defaults to secure cookies; set COOKIE_SECURE=false ONLY for local HTTP.
    cookie-secure: ${COOKIE_SECURE:true}

  setup:
    # Must be set before the first admin account can be created.
    key: ${ADMIN_SETUP_KEY:}

  pdf:
    # Leave empty for automatic font selection, or set a Windows .ttf file path.
    font-path: ${PDF_FONT_PATH:}
